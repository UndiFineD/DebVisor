# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/v0.20.0/schema/markdownlint-cli2-config-schema.json
# markdownlint-cli2 configuration
# - Uses existing rule config in .markdownlint.jsonc
# - Ignores virtualenv and third-party content (site-packages, dist-info)

globs:
  - "**/*.md"
  - "**/*.mdx"
  - "**/*.markdown"

ignores:
  - ".git/**"
  - "node_modules/**"
  - ".venv/**"
  - ".venv-*/**"
  - "**/site-packages/**"
  - "**/*.dist-info/**"
