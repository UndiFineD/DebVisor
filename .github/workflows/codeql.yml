name: CodeQL Analysis
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  schedule:
  - cron: 0 3 * * 0
  workflow_dispatch: null
defaults:
  run:
    shell: bash
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
    steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - name: Initialize CodeQL
      uses: github/codeql-action/init@a2d9de63c2916881d0621fdb7e65abe32141606d
      with:
        languages: ${{ matrix.language }}
    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
    - name: Install dependencies
      if: matrix.language == 'python'
      run: 'python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

        '
    - name: Autobuild / Install
      uses: github/codeql-action/autobuild@a2d9de63c2916881d0621fdb7e65abe32141606d
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@a2d9de63c2916881d0621fdb7e65abe32141606d
      with:
        category: /language:${{ matrix.language }}
  summary:
    name: CodeQL Summary
    runs-on: ubuntu-latest
    needs:
    - analyze
    if: always()
    steps:
    - name: Summary
      run: 'echo "CodeQL job result: ${{ needs.analyze.result }}"

        '
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
